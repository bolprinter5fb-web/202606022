<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青蛙過河 Frogger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0d0d2b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 16px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #fff;
        }
        .header h1 {
            font-size: 22px;
            letter-spacing: 2px;
        }
        .stats {
            display: flex;
            gap: 16px;
        }
        .stats div { text-align: center; }
        .stats .label {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stats .value {
            font-size: 20px;
            font-weight: 700;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            background: #2d1f0e;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 500 / 580;
            image-rendering: pixelated;
            touch-action: none;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start { background: #2ecc71; color: #fff; }
        .btn-start:hover { background: #27ae60; }
        .btn-reset { background: #e74c3c; color: #fff; }
        .btn-reset:hover { background: #c0392b; }
        .btn-music {
            background: rgba(255,255,255,0.1);
            color: #fff;
            min-width: 44px;
        }
        .btn-music:hover { background: rgba(255,255,255,0.2); }
        .btn-music.muted { opacity: 0.4; }

        .dpad {
            display: none;
            margin-top: 10px;
            touch-action: none;
        }
        .dpad-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .dpad-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 14px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background 0.1s;
        }
        .dpad-btn:active { background: rgba(255,255,255,0.3); }
        .dpad-space { width: 60px; }

        @media (pointer: coarse) {
            .dpad { display: block; }
            .hint { display: none; }
        }

        .hint {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 8px;
        }
        .github-link { margin-top: 10px; }
        .github-link a {
            color: rgba(255,255,255,0.2);
            text-decoration: none;
            font-size: 12px;
        }
        .github-link a:hover { color: rgba(255,255,255,0.5); }
        .high-score {
            color: rgba(255,215,0,0.6);
            font-size: 11px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🐸 青蛙過河</h1>
        <div class="stats">
            <div><div class="label">分數</div><div class="value" id="score">0</div></div>
            <div><div class="label">生命</div><div class="value" id="lives">3</div></div>
            <div><div class="label">關卡</div><div class="value" id="level">1</div></div>
        </div>
    </div>
    <canvas id="game" width="500" height="580"></canvas>
    <div class="high-score" id="highScore"></div>
    <div class="controls">
        <button class="btn-start" id="btnStart">▶ 開始</button>
        <button class="btn-music" id="btnMusic">🎵</button>
        <button class="btn-reset" id="btnReset">↻ 重來</button>
    </div>
    <div class="dpad">
        <div class="dpad-row">
            <div class="dpad-space"></div>
            <button class="dpad-btn" data-dir="up">▲</button>
            <div class="dpad-space"></div>
        </div>
        <div class="dpad-row">
            <button class="dpad-btn" data-dir="left">◀</button>
            <button class="dpad-btn" data-dir="down">▼</button>
            <button class="dpad-btn" data-dir="right">▶</button>
        </div>
    </div>
    <div class="hint">方向鍵 / 滑動畫面 移動青蛙</div>
    <div class="github-link">
        <a href="https://github.com/bolprinter5fb-web/202606022" target="_blank">GitHub</a>
    </div>
</div>
<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');
    const highScoreEl = document.getElementById('highScore');

    const CELL = 40;
    const COLS = 13;
    const ROWS = 14;

    let frog, score, lives, level, gameOver, win, running;
    let obstacles = [], logs = [], particles = [];
    let frame = 0, animationId = null;
    let highScore = parseInt(localStorage.getItem('frogger_high') || '0');

    const ROAD_ROWS = [4, 5, 6, 7, 8];
    const RIVER_ROWS = [9, 10, 11, 12];

    // Audio - uses AudioBuffer (PCM) synthesis for iOS compatibility
    let audioCtx = null;
    let musicGain = null;
    let musicPlaying = false;
    let musicOn = true;
    let bgmSource = null;
    let audioReady = false;

    // Pre-rendered sound buffers
    let _BGM, _HIT, _LEVELUP, _GAMEOVER, _JUMP;

    function ensureCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    function renderTone(sr, freq, dur, type) {
        const len = Math.floor(sr * dur);
        const b = new Float32Array(len);
        for (let i = 0; i < len; i++) {
            const t = i / sr, env = Math.max(0, 1 - i / len);
            let v = 0;
            if (freq > 0) {
                if (type === 'sine') v = Math.sin(2 * Math.PI * freq * t);
                else if (type === 'saw') v = 2 * (freq * t % 1) - 1;
                else if (type === 'tri') { const p = 2 * (freq * t % 1) - 1; v = 2 * Math.abs(p) - 1; }
                else v = Math.sin(2 * Math.PI * freq * t) > 0 ? 1 : -1;
            }
            b[i] = v * env * 0.3;
        }
        return b;
    }

    function renderMelody(sr, notes) {
        let total = 0;
        for (const [_, d] of notes) total += d;
        const len = Math.floor(sr * total);
        const b = new Float32Array(len);
        let off = 0;
        for (const [freq, dur] of notes) {
            const samples = Math.floor(sr * dur);
            const tone = renderTone(sr, freq, dur * 0.9, 'tri');
            for (let i = 0; i < samples && i < tone.length && off + i < len; i++) b[off + i] = tone[i];
            off += samples;
        }
        return b;
    }

    function renderMulti(sr, notes) {
        let total = 0;
        for (const [_, d] of notes) total += d;
        const len = Math.floor(sr * total);
        const b = new Float32Array(len);
        let off = 0;
        for (const [freq, dur, type] of notes) {
            const samples = Math.floor(sr * dur);
            const tone = renderTone(sr, freq, dur, type);
            for (let i = 0; i < samples && i < tone.length && off + i < len; i++) b[off + i] = tone[i];
            off += samples;
        }
        return b;
    }

    function bufferFromArray(sr, arr) {
        const buf = audioCtx.createBuffer(1, arr.length, sr);
        buf.getChannelData(0).set(arr);
        return buf;
    }

    async function primeAudio() {
        if (audioReady) return;
        const ctx = ensureCtx();
        if (ctx.state === 'suspended') await ctx.resume();
        const sr = ctx.sampleRate;

        musicGain = ctx.createGain();
        musicGain.gain.value = 0.06;
        musicGain.connect(ctx.destination);

        // Pre-render BGM (entire melody as one buffer, looped natively)
        const bgmNotes = [
            [262, 0.2], [294, 0.2], [330, 0.2], [349, 0.2],
            [392, 0.3], [392, 0.1], [349, 0.2], [330, 0.2],
            [294, 0.3], [262, 0.2], [294, 0.2], [330, 0.2],
            [262, 0.4],
            [330, 0.2], [349, 0.2], [392, 0.2], [440, 0.2],
            [392, 0.3], [349, 0.2], [330, 0.2], [294, 0.2],
            [262, 0.3], [294, 0.2], [330, 0.2], [349, 0.2],
            [262, 0.4],
        ];
        _BGM = bufferFromArray(sr, renderMelody(sr, bgmNotes));

        // Pre-render SFX (each is one contiguous buffer)
        _HIT = bufferFromArray(sr, renderMulti(sr, [[200, 0.15, 'saw'], [150, 0.25, 'saw']]));
        _LEVELUP = bufferFromArray(sr, renderMulti(sr, [[523, 0.2, 'tri'], [587, 0.2, 'tri'], [659, 0.2, 'tri'], [784, 0.2, 'tri'], [1047, 0.3, 'tri']]));
        _GAMEOVER = bufferFromArray(sr, renderMulti(sr, [[392, 0.25, 'saw'], [349, 0.25, 'saw'], [330, 0.25, 'saw'], [262, 0.3, 'saw'], [196, 0.35, 'saw'], [131, 0.4, 'saw']]));
        _JUMP = bufferFromArray(sr, renderTone(sr, 660, 0.06, 'sine'));

        audioReady = true;
    }

    function playBuf(buf, vol) {
        if (!audioReady) return;
        try {
            const src = audioCtx.createBufferSource();
            const g = audioCtx.createGain();
            g.gain.value = vol || 0.12;
            src.buffer = buf;
            src.connect(g);
            g.connect(audioCtx.destination);
            src.start();
        } catch (_) {}
    }

    function playBGM() {
        if (!musicOn || !audioReady) return;
        stopBGM();
        bgmSource = audioCtx.createBufferSource();
        bgmSource.buffer = _BGM;
        bgmSource.loop = true;
        bgmSource.connect(musicGain);
        bgmSource.start();
        musicPlaying = true;
    }

    function stopBGM() {
        if (bgmSource) { try { bgmSource.stop(); bgmSource.disconnect(); } catch (_) {} bgmSource = null; }
        musicPlaying = false;
    }

    function playHitSound() { playBuf(_HIT, 0.15); }
    function playLevelUpSound() { playBuf(_LEVELUP, 0.15); }
    function playGameOverSound() { playBuf(_GAMEOVER, 0.15); }
    function playJumpSound() { playBuf(_JUMP, 0.08); }

    function toggleMusic() {
        musicOn = !musicOn;
        document.getElementById('btnMusic').textContent = musicOn ? '🎵' : '🔇';
        document.getElementById('btnMusic').classList.toggle('muted', !musicOn);
        if (musicOn && running) playBGM();
        else stopBGM();
    }

    // Particles
    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                decay: 0.01 + Math.random() * 0.02,
                size: 2 + Math.random() * 4,
                color: color || '#ffd700',
            });
        }
    }

    function spawnStars(y) {
        const emojis = ['⭐', '🌟', '✨', '🎉', '🎊'];
        for (let i = 0; i < 10; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 2;
            particles.push({
                x: 250, y: y || 20,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1,
                life: 1,
                decay: 0.005 + Math.random() * 0.01,
                size: 16 + Math.random() * 8,
                color: '#fff',
                emoji: emojis[Math.floor(Math.random() * emojis.length)],
            });
        }
    }

    function init() {
        frog = { x: 6, y: 13 };
        score = 0;
        lives = 3;
        level = 1;
        gameOver = false;
        win = false;
        running = false;
        obstacles = [];
        logs = [];
        particles = [];
        highScoreEl.textContent = highScore > 0 ? '🏆 最高分: ' + highScore : '';
        generateLevel();
        updateUI();
        draw();
    }

    function generateLevel() {
        obstacles = [];
        logs = [];
        const speed = 0.5 + level * 0.3;

        const carTypes = [
            { color: '#e74c3c', label: '🚗', w: 1.5 },
            { color: '#f39c12', label: '🚙', w: 1.8 },
            { color: '#3498db', label: '🚕', w: 1.5 },
            { color: '#9b59b6', label: '🚐', w: 2 },
            { color: '#e67e22', label: '🚚', w: 2.5 },
        ];

        ROAD_ROWS.forEach((row, i) => {
            const dir = i % 2 === 0 ? 1 : -1;
            const t = carTypes[i % carTypes.length];
            const count = 2 + Math.floor(level / 2);
            for (let j = 0; j < count; j++) {
                obstacles.push({
                    x: (j * 4 + i * 1.5 + Math.random() * 2) % COLS,
                    y: row,
                    w: t.w,
                    h: 0.9,
                    dir: dir,
                    speed: speed * (0.8 + Math.random() * 0.5),
                    color: t.color,
                    label: t.label,
                });
            }
        });

        RIVER_ROWS.forEach((row, i) => {
            const dir = i % 2 === 0 ? 1 : -1;
            const count = 2 + Math.floor(level / 2);
            for (let j = 0; j < count; j++) {
                logs.push({
                    x: (j * 3 + i * 2 + Math.random()) % COLS,
                    y: row,
                    w: 1.8 + Math.random() * 1.8,
                    h: 0.9,
                    dir: dir,
                    speed: speed * (0.6 + Math.random() * 0.5),
                });
            }
        });
    }

    function updateUI() {
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        levelEl.textContent = level;
    }

    function resetFrog() {
        frog.x = 6;
        frog.y = 13;
    }

    function moveFrog(dx, dy) {
        if (gameOver || win || !running) return;
        if (!musicPlaying && musicOn) playBGM();
        const nx = frog.x + dx;
        const ny = frog.y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;

        frog.x = nx;
        frog.y = ny;
        playJumpSound();
        spawnParticles(nx * CELL + CELL / 2, ny * CELL + CELL / 2, '#2ecc71', 3);

        if (ny <= 2) {
            if (ny === 0) {
                level++;
                playLevelUpSound();
                spawnStars(20);
                spawnStars(40);
                generateLevel();
                resetFrog();
                updateUI();
                return;
            }
        }

        checkCollisions();
        updateUI();
    }

    function checkCollisions() {
        const nx = frog.x, ny = frog.y;
        if (ny >= 3 && ny <= 8) {
            for (const o of obstacles) {
                if (o.y === ny && nx >= o.x && nx < o.x + o.w) {
                    hit(); return;
                }
            }
        }
        if (ny >= 9 && ny <= 12) {
            let onLog = false;
            for (const l of logs) {
                if (l.y === ny && nx >= l.x && nx < l.x + l.w) {
                    onLog = true; break;
                }
            }
            if (!onLog) {
                if (ny === 12) { hit(); return; }
                hit(); return;
            }
        }
    }

    function hit() {
        lives--;
        playHitSound();
        spawnParticles(frog.x * CELL + CELL / 2, frog.y * CELL + CELL / 2, '#e74c3c', 15);
        updateUI();
        if (lives <= 0) {
            gameOver = true;
            running = false;
            stopBGM();
            playGameOverSound();
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('frogger_high', String(highScore));
                highScoreEl.textContent = '🏆 最高分: ' + highScore;
            }
        } else {
            resetFrog();
        }
    }

    function update() {
        if (!running || gameOver || win) return;
        frame++;

        for (const o of obstacles) {
            o.x += o.dir * o.speed * 0.03;
            if (o.dir > 0 && o.x > COLS + 2) o.x = -o.w;
            if (o.dir < 0 && o.x < -o.w - 2) o.x = COLS;
        }

        for (const l of logs) {
            l.x += l.dir * l.speed * 0.03;
            if (l.dir > 0 && l.x > COLS + 2) l.x = -l.w;
            if (l.dir < 0 && l.x < -l.w - 2) l.x = COLS;
        }

        if (frog.y >= 9 && frog.y <= 12) {
            let onLog = false;
            for (const l of logs) {
                if (l.y === frog.y && frog.x >= l.x && frog.x < l.x + l.w) {
                    onLog = true;
                    frog.x += l.dir * l.speed * 0.03;
                    if (frog.x < 0) frog.x = 0;
                    if (frog.x >= COLS) frog.x = COLS - 1;
                    break;
                }
            }
            if (!onLog) {
                hit();
            }
        }

        if (frog.y >= 3 && frog.y <= 8) {
            for (const o of obstacles) {
                if (o.y === frog.y && frog.x >= o.x && frog.x < o.x + o.w) {
                    hit(); break;
                }
            }
        }

        // score for being on river/road
        if (frame % 30 === 0 && frog.y <= 2) {
            score += 1;
            updateUI();
        }

        particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.05;
            p.life -= p.decay;
            return p.life > 0;
        });
    }

    function draw() {
        ctx.clearRect(0, 0, 500, 580);
        drawBackground();
        drawRoads();
        drawRiver();
        drawObstacles();
        drawLogs();
        drawParticles();
        drawGoals();
        if (!gameOver) drawFrog();
        drawUI();
        drawOverlay();
    }

    function drawOverlay() {
        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, 500, 580);
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 44px Segoe UI, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💀 遊戲結束', 250, 220);

            ctx.fillStyle = '#fff';
            ctx.font = '28px Segoe UI, Arial, sans-serif';
            ctx.fillText('分數: ' + score, 250, 290);

            if (score >= highScore && score > 0) {
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 22px Segoe UI, Arial, sans-serif';
                ctx.fillText('🎉 新紀錄！', 250, 340);
            }

            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '16px Segoe UI, Arial, sans-serif';
            ctx.fillText('按「開始」重新挑戰', 250, 400);
        } else if (!running) {
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(0, 0, 500, 580);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 32px Segoe UI, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🐸 青蛙過河', 250, 250);
            ctx.font = '18px Segoe UI, Arial, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.fillText('按「開始」進入遊戲', 250, 310);
        }
    }

    function drawBackground() {
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < COLS; c++) {
                ctx.fillStyle = (r + c) % 2 === 0 ? '#3a5a1a' : '#4a7a2a';
                ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
            }
        }
        for (let c = 0; c < COLS; c++) {
            ctx.fillStyle = c % 2 === 0 ? '#2d5a1a' : '#3d7a2a';
            ctx.fillRect(c * CELL, 13 * CELL, CELL, CELL);
        }
    }

    function drawRoads() {
        ROAD_ROWS.forEach(row => {
            const y = row * CELL;
            ctx.fillStyle = '#444';
            ctx.fillRect(0, y, 500, CELL);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.setLineDash([8, 12]);
            ctx.beginPath();
            ctx.moveTo(0, y + CELL / 2);
            ctx.lineTo(500, y + CELL / 2);
            ctx.stroke();
            ctx.setLineDash([]);
        });
    }

    function drawRiver() {
        RIVER_ROWS.forEach(row => {
            const y = row * CELL;
            ctx.fillStyle = '#1a5276';
            ctx.fillRect(0, y, 500, CELL);
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for (let x = 0; x < 500; x += 20) {
                const offset = (x + frame * 0.5) % 30;
                ctx.fillRect(x + offset, y + 5, 10, 2);
                ctx.fillRect(x + offset + 15, y + 25, 10, 2);
            }
        });
    }

    function drawObstacles() {
        for (const o of obstacles) {
            const x = o.x * CELL;
            const y = o.y * CELL + 4;
            const w = o.w * CELL - 4;
            const h = CELL - 8;
            ctx.fillStyle = o.color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 6);
            ctx.fill();
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 4;
            ctx.font = Math.min(w * 0.55, 24) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(o.label, x + w / 2, y + h / 2 + 1);
            ctx.shadowBlur = 0;
        }
    }

    function drawLogs() {
        for (const l of logs) {
            const x = l.x * CELL;
            const y = l.y * CELL + 4;
            const w = l.w * CELL - 4;
            const h = CELL - 8;
            const grad = ctx.createLinearGradient(x, y, x, y + h);
            grad.addColorStop(0, '#5d4037');
            grad.addColorStop(0.5, '#795548');
            grad.addColorStop(1, '#4e342e');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 4);
            ctx.fill();
            ctx.strokeStyle = '#3e2723';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i < Math.floor(l.w); i++) {
                ctx.fillRect(x + i * CELL + 10, y + 4, 3, h - 8);
            }
        }
    }

    function drawParticles() {
        for (const p of particles) {
            ctx.globalAlpha = Math.max(0, p.life);
            if (p.emoji) {
                ctx.font = p.size + 'px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.emoji, p.x, p.y);
            } else {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
    }

    function drawGoals() {
        for (let c = 2; c < COLS - 2; c++) {
            if ((c + level) % 3 === 0) {
                const x = c * CELL;
                ctx.fillStyle = 'rgba(255,215,0,0.1)';
                ctx.fillRect(x, 0, CELL, CELL / 2);
                ctx.font = '22px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('🏠', x + CELL / 2, 2);
            }
        }
    }

    function drawFrog() {
        const x = frog.x * CELL;
        const y = frog.y * CELL;
        const cx = x + CELL / 2;
        const cy = y + CELL / 2;

        ctx.save();

        ctx.shadowColor = 'rgba(0,255,100,0.4)';
        ctx.shadowBlur = 18;

        ctx.fillStyle = '#2ecc71';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 2, 16, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.ellipse(cx - 10, cy - 5, 8, 6, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 10, cy - 5, 8, 6, 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx - 8, cy - 7, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 8, cy - 7, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(cx - 8, cy - 7, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 8, cy - 7, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.ellipse(cx - 3, cy + 2, 2.5, 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy + 2, 2.5, 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.ellipse(cx - 14, cy - 2, 5, 3, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 14, cy - 2, 5, 3, 0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawUI() {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 3 * CELL, 500, 4);
        ctx.fillRect(0, 12 * CELL, 500, 4);

        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.font = '12px Segoe UI, Arial, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
    }

    function gameLoop() {
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    // Input
    (function setupAudioUnlock() {
        const fn = () => { if (!audioCtx) ensureCtx(); };
        document.addEventListener('touchstart', fn, { once: true });
        document.addEventListener('mousedown', fn, { once: true });
    })();

    document.addEventListener('keydown', e => {
        if (e.key.startsWith('Arrow')) e.preventDefault();
        const map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
        if (map[e.key]) moveFrog(...map[e.key]);
    });

    document.querySelectorAll('.dpad-btn').forEach(btn => {
        const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
        btn.addEventListener('touchstart', e => { e.preventDefault(); moveFrog(...map[btn.dataset.dir]); });
        btn.addEventListener('mousedown', e => { e.preventDefault(); moveFrog(...map[btn.dataset.dir]); });
    });

    let touchX = 0, touchY = 0, touchId = null;
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.touches[0];
        touchX = t.clientX; touchY = t.clientY; touchId = t.identifier;
    }, { passive: false });
    canvas.addEventListener('touchend', e => {
        e.preventDefault();
        for (const t of e.changedTouches) {
            if (touchId !== null && t.identifier === touchId) {
                const dx = t.clientX - touchX, dy = t.clientY - touchY;
                if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
                if (Math.abs(dx) > Math.abs(dy)) moveFrog(dx > 0 ? 1 : -1, 0);
                else moveFrog(0, dy > 0 ? 1 : -1);
                touchId = null; return;
            }
        }
    }, { passive: false });
    canvas.addEventListener('touchcancel', e => { touchId = null; }, { passive: false });

    document.getElementById('btnStart').addEventListener('click', async () => {
        await primeAudio();
        if (gameOver) init();
        running = true;
        if (musicOn) playBGM();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
        stopBGM();
        init();
    });

    document.getElementById('btnMusic').addEventListener('click', toggleMusic);

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w / 2) r = w / 2;
            if (r > h / 2) r = h / 2;
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        };
    }

    init();
    gameLoop();
</script>
</body>
