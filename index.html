<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 小遊戲樂園</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #fff;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(255,255,255,0.1);
        }
        .header p {
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            margin-top: 8px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 28px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .card .icon {
            font-size: 56px;
            margin-bottom: 16px;
            transition: transform 0.3s;
        }
        .card:hover .icon {
            transform: scale(1.1) rotate(-5deg);
        }
        .card .name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .card .desc {
            color: rgba(255,255,255,0.45);
            font-size: 13px;
            line-height: 1.5;
        }
        .card .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #2ecc71;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .card .badge.soon {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
        }
        .card.coming-soon {
            cursor: default;
            opacity: 0.5;
        }
        .card.coming-soon:hover {
            transform: none;
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.05);
            box-shadow: none;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: rgba(255,255,255,0.15);
            font-size: 13px;
        }
        .footer a {
            color: rgba(255,255,255,0.25);
            text-decoration: none;
        }
        .footer a:hover { color: rgba(255,255,255,0.5); }
        @media (max-width: 480px) {
            .header h1 { font-size: 28px; }
            .card { padding: 20px; }
            .card .icon { font-size: 40px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎮 小遊戲樂園</h1>
        <p>精選小遊戲，陸續新增中</p>
    </div>
    <div class="grid">
        <a class="card" href="frogger.html">
            <span class="badge">已上線</span>
            <div class="icon">🐸</div>
            <div class="name">青蛙過河</div>
            <div class="desc">經典 Frogger 遊戲！避開車流、搭浮木過河，挑戰最高分！</div>
        </a>
        <div class="card coming-soon">
            <span class="badge soon">即將推出</span>
            <div class="icon">❓</div>
            <div class="name">新遊戲敬請期待</div>
            <div class="desc">更多有趣的小遊戲正在開發中⋯</div>
        </div>
        <div class="card coming-soon">
            <span class="badge soon">即將推出</span>
            <div class="icon">❓</div>
            <div class="name">新遊戲敬請期待</div>
            <div class="desc">更多有趣的小遊戲正在開發中⋯</div>
        </div>
    </div>
    <div class="footer">
        <a href="https://github.com/bolprinter5fb-web/202606022" target="_blank">GitHub</a>
    </div>
</div>
</body>
</html>
