<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 綁定成功!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        .checkmark {
            width: 80px;
            height: 80px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            margin: 0 auto 24px;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }
        h1 { color: #333; margin-bottom: 8px; }
        p { color: #666; line-height: 1.6; }
        .email {
            background: #f0f0f0;
            padding: 12px 24px;
            border-radius: 8px;
            display: inline-block;
            margin: 16px 0;
            font-family: monospace;
            font-size: 14px;
            color: #333;
        }
        .info {
            background: #e3f2fd;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            font-size: 14px;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="checkmark">&#10003;</div>
        <h1>GitHub 綁定成功!</h1>
        <p>本頁面已成功部署至 GitHub Pages</p>
        <div class="email">bol.printer.5fb@gmail.com</div>
        <div class="info">
            Git + GitHub CLI (gh) 設定完成<br>
            可正常進行版本控制與遠端推送
        </div>
    </div>
</body>
</html>
