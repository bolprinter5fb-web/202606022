<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - 互動遊戲</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 520px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .title h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
        }
        .title p {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-top: 2px;
        }
        .score-box {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 12px;
            text-align: center;
        }
        .score-box .label {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-box .value {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 8px;
            aspect-ratio: 1;
        }
        .cell {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            transition: all 0.1s ease;
            aspect-ratio: 1;
            user-select: none;
        }
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 22px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 22px; box-shadow: 0 0 30px 10px rgba(237,194,46,0.3); }
        .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 18px; }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-new {
            background: #e94560;
            color: #fff;
        }
        .btn-new:hover { background: #d63851; transform: translateY(-1px); }
        .btn-undo {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .btn-undo:hover { background: rgba(255,255,255,0.2); }
        .game-over {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 28px;
            font-weight: 800;
        }
        .game-over.show { display: flex; }
        .game-over p { margin-bottom: 16px; }
        .game-over button {
            padding: 12px 32px;
            border: none;
            border-radius: 10px;
            background: #e94560;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .game-over button:hover { background: #d63851; }
        .board-wrap {
            position: relative;
        }
        .hint {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            margin-top: 12px;
        }
        .github-link {
            text-align: center;
            margin-top: 16px;
        }
        .github-link a {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 12px;
        }
        .github-link a:hover { color: rgba(255,255,255,0.6); }
        @media (max-width: 480px) {
            .container { padding: 16px; }
            .title h1 { font-size: 22px; }
            .cell { font-size: 24px; }
            .tile-128, .tile-256, .tile-512 { font-size: 20px; }
            .tile-1024, .tile-2048 { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">
            <h1>2048</h1>
            <p>合併方塊．挑戰最高分</p>
        </div>
        <div class="score-box">
            <div class="label">分數</div>
            <div class="value" id="score">0</div>
        </div>
    </div>
    <div class="board-wrap">
        <div class="grid" id="grid"></div>
        <div class="game-over" id="gameOver">
            <p>遊戲結束！</p>
            <button onclick="initGame()">重新開始</button>
        </div>
    </div>
    <div class="controls">
        <button class="btn-new" onclick="initGame()">🔄 新遊戲</button>
        <button class="btn-undo" onclick="undo()">↩ 復原</button>
    </div>
    <div class="hint">方向鍵 / 滑鼠滑動 操作</div>
    <div class="github-link">
        <a href="https://github.com/bolprinter5fb-web/202606022" target="_blank">GitHub 綁定成功</a>
    </div>
</div>

<script>
    let grid = [], score = 0, history = [], size = 4;
    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('gameOver');

    function initGame() {
        grid = Array(size).fill().map(() => Array(size).fill(0));
        score = 0; history = [];
        gameOverEl.classList.remove('show');
        addTile(); addTile();
        render();
    }

    function addTile() {
        const empty = [];
        for (let r = 0; r < size; r++)
            for (let c = 0; c < size; c++)
                if (grid[r][c] === 0) empty.push({r, c});
        if (empty.length === 0) return;
        const {r, c} = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
        gridEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const val = grid[r][c];
                const cell = document.createElement('div');
                cell.className = 'cell' + (val ? ' tile-' + val : '');
                if (val > 2048) cell.className = 'cell tile-super';
                cell.textContent = val || '';
                gridEl.appendChild(cell);
            }
        }
        scoreEl.textContent = score;
    }

    function clone(g) { return g.map(r => [...r]); }

    function moveLeft() {
        let moved = false;
        for (let r = 0; r < size; r++) {
            let row = grid[r].filter(v => v !== 0);
            for (let i = 0; i < row.length - 1; i++) {
                if (row[i] === row[i + 1]) {
                    row[i] *= 2; score += row[i]; row.splice(i + 1, 1);
                }
            }
            while (row.length < size) row.push(0);
            if (row.join(',') !== grid[r].join(',')) moved = true;
            grid[r] = row;
        }
        return moved;
    }

    function rotate(g) {
        const n = g.length;
        return Array.from({length: n}, (_, i) => g.map(r => r[i]).reverse());
    }

    function move(dir) {
        history.push({grid: clone(grid), score});
        if (history.length > 10) history.shift();
        let moved = false;
        if (dir === 0) moved = moveLeft();
        else {
            for (let i = 0; i < dir; i++) grid = rotate(grid);
            moved = moveLeft();
            for (let i = 0; i < (4 - dir) % 4; i++) grid = rotate(grid);
        }
        if (moved) { addTile(); render(); checkGameOver(); }
        else history.pop();
    }

    function undo() {
        if (history.length === 0) return;
        const prev = history.pop();
        grid = prev.grid; score = prev.score;
        gameOverEl.classList.remove('show');
        render();
    }

    function canMove() {
        for (let r = 0; r < size; r++)
            for (let c = 0; c < size; c++) {
                if (grid[r][c] === 0) return true;
                if (c < size - 1 && grid[r][c] === grid[r][c + 1]) return true;
                if (r < size - 1 && grid[r][c] === grid[r + 1][c]) return true;
            }
        return false;
    }

    function checkGameOver() {
        if (!canMove()) gameOverEl.classList.add('show');
    }

    document.addEventListener('keydown', e => {
        if (e.key.startsWith('Arrow')) e.preventDefault();
        const map = {ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3};
        if (map.hasOwnProperty(e.key)) move(map[e.key]);
    });

    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, {passive: true});
    document.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const absDx = Math.abs(dx), absDy = Math.abs(dy);
        if (Math.max(absDx, absDy) < 30) return;
        if (absDx > absDy) move(dx > 0 ? 2 : 0);
        else move(dy > 0 ? 3 : 1);
    }, {passive: true});

    initGame();
</script>
</body>
</html>
