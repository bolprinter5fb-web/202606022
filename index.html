<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青蛙過河 Frogger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0d0d2b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 16px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #fff;
        }
        .header h1 {
            font-size: 22px;
            letter-spacing: 2px;
        }
        .stats {
            display: flex;
            gap: 20px;
        }
        .stats div {
            text-align: center;
        }
        .stats .label {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stats .value {
            font-size: 22px;
            font-weight: 700;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            background: #2d1f0e;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 500 / 580;
            image-rendering: pixelated;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background: #2ecc71;
            color: #fff;
        }
        .btn-start:hover { background: #27ae60; }
        .btn-reset {
            background: #e74c3c;
            color: #fff;
        }
        .btn-reset:hover { background: #c0392b; }

        .dpad {
            display: none;
            margin-top: 12px;
            touch-action: none;
        }
        .dpad-row {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .dpad-btn {
            width: 64px;
            height: 64px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background 0.1s;
        }
        .dpad-btn:active { background: rgba(255,255,255,0.25); }
        .dpad-space { width: 64px; }

        @media (pointer: coarse) {
            .dpad { display: block; }
            .hint { display: none; }
        }

        .hint {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 10px;
        }
        .github-link {
            margin-top: 12px;
        }
        .github-link a {
            color: rgba(255,255,255,0.2);
            text-decoration: none;
            font-size: 12px;
        }
        .github-link a:hover { color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🐸 青蛙過河</h1>
        <div class="stats">
            <div><div class="label">分數</div><div class="value" id="score">0</div></div>
            <div><div class="label">生命</div><div class="value" id="lives">3</div></div>
            <div><div class="label">關卡</div><div class="value" id="level">1</div></div>
        </div>
    </div>
    <canvas id="game" width="500" height="580"></canvas>
    <div class="controls">
        <button class="btn-start" id="btnStart">▶ 開始遊戲</button>
        <button class="btn-reset" id="btnReset">↻ 重新開始</button>
    </div>
    <div class="dpad">
        <div class="dpad-row">
            <div class="dpad-space"></div>
            <button class="dpad-btn" data-dir="up">▲</button>
            <div class="dpad-space"></div>
        </div>
        <div class="dpad-row">
            <button class="dpad-btn" data-dir="left">◀</button>
            <button class="dpad-btn" data-dir="down">▼</button>
            <button class="dpad-btn" data-dir="right">▶</button>
        </div>
    </div>
    <div class="hint">方向鍵 / 滑動畫面 移動青蛙</div>
    <div class="github-link">
        <a href="https://github.com/bolprinter5fb-web/202606022" target="_blank">GitHub</a>
    </div>
</div>
<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');

    const CELL = 40;
    const COLS = 13;
    const ROWS = 14;

    let frog, score, lives, level, gameOver, win, running;
    let obstacles = [];
    let logs = [];
    let keys = {};
    let moveCooldown = 0;
    let frame = 0;
    let animationId = null;

    const ROAD_ROWS = [4, 5, 6, 7, 8];
    const RIVER_ROWS = [9, 10, 11, 12];

    function init() {
        frog = { x: 6, y: 13, w: 0.7, h: 0.7 };
        score = 0;
        lives = 3;
        level = 1;
        gameOver = false;
        win = false;
        running = false;
        obstacles = [];
        logs = [];
        moveCooldown = 0;
        generateLevel();
        updateUI();
        draw();
    }

    function generateLevel() {
        obstacles = [];
        logs = [];
        const speed = 0.5 + level * 0.3;

        const carTypes = [
            { color: '#e74c3c', label: '🚗', w: 1.5 },
            { color: '#f39c12', label: '🚙', w: 1.8 },
            { color: '#3498db', label: '🚕', w: 1.5 },
            { color: '#9b59b6', label: '🚐', w: 2 },
            { color: '#e67e22', label: '🚚', w: 2.5 },
        ];

        ROAD_ROWS.forEach((row, i) => {
            const dir = i % 2 === 0 ? 1 : -1;
            const t = carTypes[i % carTypes.length];
            const count = 1 + Math.floor(level / 2);
            for (let j = 0; j < count; j++) {
                obstacles.push({
                    x: (j * 4 + i * 2) % COLS,
                    y: row,
                    w: t.w,
                    h: 0.9,
                    dir: dir,
                    speed: speed * (0.8 + Math.random() * 0.4),
                    color: t.color,
                    label: t.label,
                });
            }
        });

        RIVER_ROWS.forEach((row, i) => {
            const dir = i % 2 === 0 ? 1 : -1;
            const count = 2 + Math.floor(level / 2);
            for (let j = 0; j < count; j++) {
                logs.push({
                    x: (j * 3 + i * 2.5) % COLS,
                    y: row,
                    w: 2 + Math.random() * 1.5,
                    h: 0.9,
                    dir: dir,
                    speed: speed * (0.6 + Math.random() * 0.4),
                });
            }
        });
    }

    function updateUI() {
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        levelEl.textContent = level;
    }

    function resetFrog() {
        frog.x = 6;
        frog.y = 13;
    }

    function moveFrog(dx, dy) {
        if (gameOver || win || !running) return;
        const nx = frog.x + dx;
        const ny = frog.y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;

        frog.x = nx;
        frog.y = ny;

        if (ny <= 2) {
            score += 10 + level * 5;
            if (ny === 0) {
                level++;
                generateLevel();
                resetFrog();
                updateUI();
                return;
            }
        }

        if (ny >= 3 && ny <= 8) {
            for (const o of obstacles) {
                if (Math.floor(o.x) === Math.floor(nx) && o.y === ny) {
                    hit();
                    return;
                }
            }
        }

        if (ny >= 9 && ny <= 12) {
            let onLog = false;
            for (const l of logs) {
                if (l.y === ny && nx >= l.x && nx < l.x + l.w) {
                    onLog = true;
                    break;
                }
            }
            if (!onLog) {
                hit();
                return;
            }
        }

        updateUI();
    }

    function hit() {
        lives--;
        updateUI();
        if (lives <= 0) {
            gameOver = true;
            running = false;
        } else {
            resetFrog();
        }
    }

    function update() {
        if (!running || gameOver || win) return;
        frame++;

        for (const o of obstacles) {
            o.x += o.dir * o.speed * 0.03;
            if (o.x > COLS + 2) o.x = -o.w;
            if (o.x < -o.w - 2) o.x = COLS;
        }

        for (const l of logs) {
            l.x += l.dir * l.speed * 0.03;
            if (l.x > COLS + 2) l.x = -l.w;
            if (l.x < -l.w - 2) l.x = COLS;
        }

        if (frog.y >= 9 && frog.y <= 12) {
            let onLog = false;
            for (const l of logs) {
                if (l.y === frog.y && frog.x >= l.x && frog.x < l.x + l.w) {
                    onLog = true;
                    frog.x += l.dir * l.speed * 0.03;
                    if (frog.x < 0) frog.x = 0;
                    if (frog.x >= COLS) frog.x = COLS - 1;
                    break;
                }
            }
            if (!onLog) {
                hit();
            }
        }

        if (frog.y >= 3 && frog.y <= 8) {
            for (const o of obstacles) {
                if (o.y === frog.y && frog.x >= o.x && frog.x < o.x + o.w) {
                    hit();
                    break;
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, 500, 580);

        drawBackground();
        drawRoads();
        drawRiver();
        drawObstacles();
        drawLogs();
        drawGoals();
        drawFrog();
        drawUI();

        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, 500, 580);
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 48px Segoe UI, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('遊戲結束', 250, 280);
            ctx.fillStyle = '#fff';
            ctx.font = '24px Segoe UI, Arial, sans-serif';
            ctx.fillText('分數: ' + score, 250, 340);
        }

        if (!running && !gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(0, 0, 500, 580);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 36px Segoe UI, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('按「開始遊戲」', 250, 280);
        }
    }

    function drawBackground() {
        ctx.fillStyle = '#3a5a1a';
        ctx.fillRect(0, 0, 500, 3 * CELL);
        ctx.fillStyle = '#4a7a2a';
        for (let r = 0; r < 3; r++)
            for (let c = 0; c < COLS; c++) {
                if ((r + c) % 2 === 0) {
                    ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
                }
            }

        ctx.fillStyle = '#2d5a1a';
        ctx.fillRect(0, 13 * CELL, 500, CELL);
        ctx.fillStyle = '#3d7a2a';
        for (let c = 0; c < COLS; c++) {
            if (c % 2 === 0) ctx.fillRect(c * CELL, 13 * CELL, CELL, CELL);
        }
    }

    function drawRoads() {
        ROAD_ROWS.forEach(row => {
            const y = row * CELL;
            ctx.fillStyle = '#444';
            ctx.fillRect(0, y, 500, CELL);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.setLineDash([8, 12]);
            ctx.beginPath();
            ctx.moveTo(0, y + CELL / 2);
            ctx.lineTo(500, y + CELL / 2);
            ctx.stroke();
            ctx.setLineDash([]);
        });
    }

    function drawRiver() {
        RIVER_ROWS.forEach(row => {
            const y = row * CELL;
            ctx.fillStyle = '#1a5276';
            ctx.fillRect(0, y, 500, CELL);
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for (let x = 0; x < 500; x += 20) {
                const offset = (x + frame * 0.5) % 30;
                ctx.fillRect(x + offset, y + 5, 10, 2);
                ctx.fillRect(x + offset + 15, y + 25, 10, 2);
            }
        });
    }

    function drawObstacles() {
        for (const o of obstacles) {
            const x = o.x * CELL;
            const y = o.y * CELL + 4;
            const w = o.w * CELL - 4;
            const h = CELL - 8;
            ctx.fillStyle = o.color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 6);
            ctx.fill();
            ctx.font = Math.min(w * 0.6, 28) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(o.label, x + w / 2, y + h / 2);
        }
    }

    function drawLogs() {
        for (const l of logs) {
            const x = l.x * CELL;
            const y = l.y * CELL + 4;
            const w = l.w * CELL - 4;
            const h = CELL - 8;
            const grad = ctx.createLinearGradient(x, y, x, y + h);
            grad.addColorStop(0, '#5d4037');
            grad.addColorStop(0.5, '#795548');
            grad.addColorStop(1, '#4e342e');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 4);
            ctx.fill();
            ctx.strokeStyle = '#3e2723';
            ctx.lineWidth = 1;
            ctx.stroke();
            for (let i = 0; i < Math.floor(l.w); i++) {
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(x + i * CELL + 8, y + 4, 4, h - 8);
            }
        }
    }

    function drawGoals() {
        ctx.fillStyle = 'rgba(255,215,0,0.15)';
        for (let c = 2; c < COLS - 2; c++) {
            if ((c + level) % 3 === 0) {
                ctx.fillRect(c * CELL, 0, CELL, CELL / 2);
                ctx.fillStyle = 'rgba(255,215,0,0.3)';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('🏠', c * CELL + CELL / 2, 4);
                ctx.fillStyle = 'rgba(255,215,0,0.15)';
            }
        }
    }

    function drawFrog() {
        const x = frog.x * CELL;
        const y = frog.y * CELL;
        const size = CELL * frog.w;
        const cx = x + CELL / 2;
        const cy = y + CELL / 2;

        ctx.save();

        ctx.shadowColor = 'rgba(0,255,0,0.3)';
        ctx.shadowBlur = 15;

        ctx.fillStyle = '#2ecc71';
        ctx.beginPath();
        ctx.ellipse(cx, cy + 2, size * 0.45, size * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#27ae60';
        ctx.beginPath();
        ctx.ellipse(cx - 10, cy - 6, 8, 6, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 10, cy - 6, 8, 6, 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx - 8, cy - 8, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 8, cy - 8, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(cx - 8, cy - 8, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 8, cy - 8, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(cx - 3, cy + 2, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 3, cy + 2, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawUI() {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 3 * CELL, 500, 4);
        ctx.fillRect(0, 12 * CELL, 500, 4);
    }

    function gameLoop() {
        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', e => {
        if (e.key.startsWith('Arrow')) e.preventDefault();
        if (e.key === 'ArrowUp') moveFrog(0, -1);
        else if (e.key === 'ArrowDown') moveFrog(0, 1);
        else if (e.key === 'ArrowLeft') moveFrog(-1, 0);
        else if (e.key === 'ArrowRight') moveFrog(1, 0);
    });

    document.querySelectorAll('.dpad-btn').forEach(btn => {
        const dir = btn.dataset.dir;
        const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
        btn.addEventListener('touchstart', e => {
            e.preventDefault();
            const [dx, dy] = map[dir];
            moveFrog(dx, dy);
        });
        btn.addEventListener('mousedown', e => {
            e.preventDefault();
            const [dx, dy] = map[dir];
            moveFrog(dx, dy);
        });
    });

    let touchX = 0, touchY = 0;
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.touches[0];
        touchX = t.clientX;
        touchY = t.clientY;
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
        e.preventDefault();
        const t = e.changedTouches[0];
        const dx = t.clientX - touchX;
        const dy = t.clientY - touchY;
        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) {
            moveFrog(dx > 0 ? 1 : -1, 0);
        } else {
            moveFrog(0, dy > 0 ? 1 : -1);
        }
    }, { passive: false });

    document.getElementById('btnStart').addEventListener('click', () => {
        if (gameOver) { init(); }
        running = true;
    });

    document.getElementById('btnReset').addEventListener('click', () => {
        init();
    });

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w / 2) r = w / 2;
            if (r > h / 2) r = h / 2;
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        };
    }

    init();
    gameLoop();
</script>
</body>
</html>
